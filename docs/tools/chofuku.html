<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重複チェック</title>
  <style>
    * {
      line-height: 1.5;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    td {
      padding: 1rem;
    }

    textarea {
      width: 100%;
      height: 10rem;
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
    }

    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    .center {
      text-align: center;
    }

    .ng {
      color: red;
    }
  </style>
</head>

<body>

  <table>
    <tr>
      <td><textarea name="a" id="a" rows="10"></textarea></td>
    </tr>
    <tr>
      <td class="center"><button id="btn">重複チェック</button></td>
    </tr>
    <tr class="center" style="border-bottom: 2px solid #000;">
      <td>
        <div id="aResultSummary"></div>
      </td>
    </tr>
    <tr>
      <td style="vertical-align: top;">
        <div id="aResult"></div>
      </td>
    </tr>
  </table>

  <script>
    btn.addEventListener('click', () => {
      const a = document.getElementById('a');

      const aLines = a.value.split('\n').filter(line => line.trim() !== '');

      const aResult = [];
      const seen = new Set();

      let aDiffCount = 0;

      for (let i = 0; i < aLines.length; i++) {
        if (seen.has(aLines[i])) {
          aResult.push('<span class="ng">' + aLines[i] + '<br></span>');
          aDiffCount++;
        } else {
          seen.add(aLines[i]);
          aResult.push(`<span class="ok" hidden>${aLines[i]}<br></span>`);
        }
      }

      document.getElementById('aResultSummary').innerHTML = `重複行数: ${aDiffCount}`;

      document.getElementById('aResult').innerHTML = aResult.join('');
    });
  </script>

</body>

</html>
