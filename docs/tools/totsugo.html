<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>突合</title>
  <style>
    * {
      line-height: 1.5;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    td {
      padding: 1rem;
    }

    textarea {
      width: 100%;
      height: 10rem;
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
    }

    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    .center {
      text-align: center;
    }

    .ng {
      color: red;
    }
  </style>
</head>

<body>

  <table>
    <tr>
      <td><textarea name="a" id="a" rows="10"></textarea></td>
      <td><textarea name="b" id="b" rows="10"></textarea></td>
    </tr>
    <tr>
      <td colspan="2" class="center"><button id="btn">突合</button></td>
    </tr>
    <tr>
      <td colspan="2" class="center">
        <input type="checkbox" name="showDifferencesOnly" id="showDifferencesOnly" checked>
        <label for="showDifferencesOnly">片方にしかない行のみを表示する</label>
      </td>
    </tr>
    <tr class="center" style="border-bottom: 2px solid #000;">
      <td>
        <div id="aResultSummary"></div>
      </td>
      <td>
        <div id="bResultSummary"></div>
      </td>
    </tr>
    <tr>
      <td style="vertical-align: top;">
        <div id="aResult"></div>
      </td>
      <td style="vertical-align: top;">
        <div id="bResult"></div>
      </td>
    </tr>
  </table>

  <script>
    btn.addEventListener('click', () => {
      const a = document.getElementById('a');
      const b = document.getElementById('b');

      const aLines = a.value.split('\n').filter(line => line.trim() !== '');
      const bLines = b.value.split('\n').filter(line => line.trim() !== '');

      const aResult = [];
      const bResult = [];

      let aDiffCount = 0;
      let bDiffCount = 0;

      for (let i = 0; i < aLines.length; i++) {
        if (bLines.includes(aLines[i])) {
          aResult.push(`<span class="ok" hidden>${aLines[i]}<br></span>`);
        } else {
          aResult.push('<span class="ng">' + aLines[i] + '<br></span>');
          aDiffCount++;
        }
      }

      for (let i = 0; i < bLines.length; i++) {
        if (aLines.includes(bLines[i])) {
          bResult.push(`<span class="ok" hidden>${bLines[i]}<br></span>`);
        } else {
          bResult.push('<span class="ng">' + bLines[i] + '<br></span>');
          bDiffCount++;
        }
      }

      document.getElementById('aResultSummary').innerHTML = `差分行数: ${aDiffCount}`;
      document.getElementById('bResultSummary').innerHTML = `差分行数: ${bDiffCount}`;

      document.getElementById('aResult').innerHTML = aResult.join('');
      document.getElementById('bResult').innerHTML = bResult.join('');
    });

    showDifferencesOnly.addEventListener('change', () => {
      if (showDifferencesOnly.checked) {
        document.querySelectorAll(`.ok`).forEach(el => el.setAttribute('hidden', 'hidden'));
        document.querySelectorAll(`.ng`).forEach(el => el.removeAttribute('hidden'));
      } else {
        document.querySelectorAll(`.ok`).forEach(el => el.removeAttribute('hidden'));
        document.querySelectorAll(`.ng`).forEach(el => el.removeAttribute('hidden'));
      }
    });
  </script>

</body>

</html>
